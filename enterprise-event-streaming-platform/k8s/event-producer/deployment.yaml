apiVersion: apps/v1
kind: Deployment
metadata:
  name: event-producer
  namespace: platform
  labels:
    app: event-producer
spec:
  replicas: 3
  selector:
    matchLabels:
      app: event-producer
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: event-producer
    spec:
      containers:
        - name: event-producer
          image: 760652872045.dkr.ecr.ap-south-1.amazonaws.com/eesp/event-producer:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20

